<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🏥 夜访废弃医院 | 完全版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0d0d0d 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .game-container {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 0 50px rgba(255, 0, 0, 0.2);
            border: 1px solid rgba(139, 0, 0, 0.5);
            max-width: 600px;
            width: 100%;
        }
        h1 { text-align: center; color: #8b0000; font-size: 1.8rem; margin-bottom: 10px; text-shadow: 0 0 10px rgba(139,0,0,0.5); }
        .subtitle { text-align: center; color: #666; font-size: 0.8rem; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .stats-bar { display: flex; justify-content: space-between; margin-bottom: 20px; padding: 10px; background: rgba(0,0,0,0.4); border-radius: 10px; font-size: 0.75rem; color: #888; flex-wrap: wrap; gap: 10px; }
        .story-area { background: rgba(0,0,0,0.6); border-radius: 15px; padding: 20px; min-height: 250px; margin-bottom: 20px; border-left: 3px solid #8b0000; }
        #storyText { color: #ddd; font-size: 1rem; line-height: 1.6; font-family: monospace; }
        .choices-area { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        .choice-btn { background: rgba(30,30,50,0.9); border: 1px solid #8b0000; color: #ffaaaa; padding: 12px 20px; border-radius: 10px; cursor: pointer; font-size: 0.95rem; text-align: left; transition: all 0.3s ease; font-family: monospace; }
        .choice-btn:hover { background: rgba(139,0,0,0.6); transform: translateX(5px); color: white; }
        .button-group { display: flex; gap: 10px; margin-top: 10px; }
        .reset-btn, .save-btn, .load-btn { flex: 1; padding: 12px; background: rgba(139,0,0,0.3); border: 1px solid #8b0000; border-radius: 10px; color: #ffaaaa; font-size: 1rem; cursor: pointer; text-align: center; }
        .reset-btn:hover, .save-btn:hover, .load-btn:hover { background: rgba(139,0,0,0.6); color: white; }
        .status { margin-top: 15px; padding-top: 10px; border-top: 1px solid #333; display: flex; justify-content: space-between; font-size: 0.7rem; color: #555; }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🏥 夜访废弃医院</h1>
        <div class="subtitle">【 完全版 · 多结局 + 存档 】</div>
        <div class="stats-bar">
            <span>🏆 解锁结局: <span id="endingCount">0</span>/<span id="totalEndings">14</span></span>
            <span>💾 存档可用</span>
            <span>🎵 点击页面启动音效</span>
        </div>
        <div class="story-area"><div id="storyText">加载中...</div></div>
        <div class="choices-area" id="choicesArea"><button class="choice-btn">...</button></div>
        <div class="button-group">
            <button id="saveBtn" class="save-btn">💾 保存游戏</button>
            <button id="loadBtn" class="load-btn">📀 读取存档</button>
            <button id="resetBtn" class="reset-btn">💀 重新开始</button>
        </div>
        <div class="status"><span>⚠️ 戴上耳机体验更佳</span><span>🎭 完全版 · 14结局</span></div>
    </div>

    <script>
        let currentNode = 'start';
        let endingsFound = [];
        const totalEndings = 14;
        document.getElementById('totalEndings').innerText = totalEndings;
        
        function updateEndingStats() { document.getElementById('endingCount').innerText = endingsFound.length; }
        function addEnding(name) { if (!endingsFound.includes(name)) { endingsFound.push(name); updateEndingStats(); console.log('🏆 新结局：'+name); } }
        
        function saveGame() {
            localStorage.setItem('horrorSave', JSON.stringify({ currentNode: currentNode, endingsFound: endingsFound, saveTime: new Date().toLocaleString() }));
            alert('💾 游戏已保存！');
        }
        function loadGame() {
            const saved = localStorage.getItem('horrorSave');
            if(saved) {
                let data = JSON.parse(saved);
                if(data.currentNode && gameData[data.currentNode]) {
                    currentNode = data.currentNode;
                    endingsFound = data.endingsFound || [];
                    updateEndingStats();
                    updateGame();
                    alert('📀 读取存档成功！');
                } else alert('❌ 存档无效');
            } else alert('❌ 无存档');
        }
        
        // 音频
        let audioCtx = null, audioStarted = false;
        function initAudio() {
            if(audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            let noiseNode = audioCtx.createScriptProcessor(4096,1,1);
            let filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 350;
            let gain = audioCtx.createGain();
            gain.gain.value = 0.1;
            noiseNode.onaudioprocess = function(e) {
                let out = e.outputBuffer.getChannelData(0);
                for(let i=0;i<4096;i++) out[i] = (Math.random()-0.5)*0.12 + Math.sin(Date.now()*0.002)*0.03;
            };
            noiseNode.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
        }
        function startAudio() { if(!audioStarted && audioCtx) { audioCtx.resume(); audioStarted=true; console.log('🎵 音效已启动'); } }
        initAudio();
        document.body.addEventListener('click', startAudio);
        
        const gameData = {
            start: { text: "🌙 深夜11:47，你和三个朋友来到废弃医院。\n\n铁门生锈，窗户漆黑。\n\n「真的要进去吗？」小杰手微微发抖。\n\n远处传来猫头鹰的叫声...", choices: [{ text:"🔦 推开铁门进去", next:"enterGate"},{ text:"😨 留在外面", next:"stayOutside"},{ text:"📸 拍张照片", next:"takePhoto"},{ text:"🔍 绕到后门", next:"backDoor"}] },
            enterGate: { text: "铁门嘎吱推开。大厅有面大镜子，楼上传来脚步声。", choices: [{ text:"🔦 上楼", next:"upstairs"},{ text:"🏃 逃跑", next:"runAway"},{ text:"🔍 搜索大厅", next:"searchHall"},{ text:"🪞 看镜子", next:"bigMirror"},{ text:"🔦 照天花板", next:"ceiling"}] },
            backDoor: { text: "后门半掩，走廊墙上挂着泛黄的照片。", choices: [{ text:"🚶 走进走廊", next:"corridor"},{ text:"🏃 回前门", next:"enterGate"},{ text:"🔦 用手电照", next:"flashlight"}] },
            flashlight: { text: "手电闪烁，照片翻转让你们快跑。", choices: [{ text:"🏃 跑回前门", next:"enterGate"},{ text:"🚶 继续走", next:"corridor"}] },
            corridor: { text: "走廊尽头是太平间，门缝冒白雾。小美尖叫：照片上是你们！", choices: [{ text:"🚪 推开太平间门", next:"morgue"},{ text:"🏃 逃跑", next:"runAway"},{ text:"📸 拍照", next:"takePhoto2"}] },
            takePhoto2: { text: "照片里你们身后站着无脸人。它们向你走来...", choices: [{ text:"💀 结局：被同化的灵魂", next:"endingBad7"},{ text:"🔄 重新开始", next:"start"}] },
            morgue: { text: "太平间铁床上躺着...小杰？但他明明在你身边！", choices: [{ text:"😱 转头看小杰", next:"lookXiaojie"},{ text:"🏃 冲出太平间", next:"runFromMorgue"}] },
            lookXiaojie: { text: "小杰露出诡异笑容：「你终于发现了...」", choices: [{ text:"💀 结局：替代品", next:"endingBad8"},{ text:"🔄 重新开始", next:"start"}] },
            runFromMorgue: { text: "你们冲出医院，但车上多了一个人...", choices: [{ text:"🌅 结局：永远的多一人", next:"endingMixed2"},{ text:"🔄 重新开始", next:"start"}] },
            ceiling: { text: "天花板布满手印，一张惨白的脸倒挂在你面前！", choices: [{ text:"👧 转头", next:"littleGirl"},{ text:"🏃 逃跑", next:"runAway"}] },
            littleGirl: { text: "小女孩抱着布娃娃：「陪我玩...」布娃娃眼睛转向你。", choices: [{ text:"💀 结局：布娃娃的诅咒", next:"endingDoll"},{ text:"🔄 重新开始", next:"start"}] },
            bigMirror: { text: "镜子里多了一个穿病号服的人，正朝你走来。", choices: [{ text:"🪞 结局：镜中囚徒", next:"endingBad4"},{ text:"🔨 砸碎镜子", next:"breakBigMirror"}] },
            breakBigMirror: { text: "镜子碎了，但从此镜中的你总在笑...", choices: [{ text:"🌅 结局：破碎的镜像", next:"endingMixed"},{ text:"🔄 重新开始", next:"start"}] },
            stayOutside: { text: "一只手从铁门缝伸出，抓住你的手腕！", choices: [{ text:"💀 结局：门外之客", next:"endingBad1"},{ text:"🔄 重新开始", next:"start"}] },
            takePhoto: { text: "照片里你们身后多了一个无脸人，它就站在你面前！", choices: [{ text:"📸 结局：镜头里的访客", next:"endingBad2"},{ text:"🔄 重新开始", next:"start"}] },
            upstairs: { text: "二楼走廊尽头门砰地关上，小美不见了！", choices: [{ text:"🚪 开门", next:"openDoor"},{ text:"🔦 找小美", next:"findMei"},{ text:"🏃 逃跑", next:"runAway"},{ text:"📞 打电话求救", next:"callHelp"}] },
            callHelp: { text: "电话接通了，但信号格是0...那头传来笑声。", choices: [{ text:"💀 结局：求救无门", next:"endingBad9"},{ text:"🔄 重新开始", next:"start"}] },
            runAway: { text: "铁门锁上了，黑暗中无数只手向你抓来。", choices: [{ text:"🏥 结局：永远的病患", next:"endingBad3"},{ text:"🔄 重新开始", next:"start"}] },
            searchHall: { text: "捡到一本日记：「不要看镜子...1949.12.31」", choices: [{ text:"🪞 看镜子", next:"lookMirror"},{ text:"🚫 砸镜子", next:"breakMirror"},{ text:"📖 读日记", next:"readDiary"}] },
            readDiary: { text: "日记说：找到地下室的红色门才能逃出去。", choices: [{ text:"🚪 找地下室", next:"basement"},{ text:"🪞 看镜子", next:"lookMirror"}] },
            basement: { text: "红色门里有一张1949年合影，中间的人长着你的脸...", choices: [{ text:"🔴 结局：真相大白", next:"endingTruth"},{ text:"🔄 重新开始", next:"start"}] },
            lookMirror: { text: "镜中的你笑了，你被拉进镜子里...", choices: [{ text:"💀 结局：镜中世界", next:"endingBad4"},{ text:"🔄 重新开始", next:"start"}] },
            breakMirror: { text: "镜子碎了，但你从此能在镜中看到另一个自己。", choices: [{ text:"🌅 结局：破碎的镜像", next:"endingMixed"},{ text:"🔄 重新开始", next:"start"}] },
            openDoor: { text: "心电图变成直线，身后传来笑声和冰凉的手...", choices: [{ text:"💀 结局：最后的诊断", next:"endingBad5"},{ text:"🔄 重新开始", next:"start"}] },
            findMei: { text: "小美转过头——她没有五官！", choices: [{ text:"💀 结局：没有五官的小美", next:"endingBad6"},{ text:"🔄 重新开始", next:"start"}] },
            endingBad1: { text: "💀 门外之客：你永远留在了医院门口。", choices: [{ text:"🔄 重新开始", next:"start"}], onLoad:()=>addEnding("门外之客") },
            endingBad2: { text: "📸 镜头里的访客：你的照片里多了无数个你。", choices: [{ text:"🔄 重新开始", next:"start"}], onLoad:()=>addEnding("镜头里的访客") },
            endingBad3: { text: "🏥 永远的病患：你成了1949号病人。", choices: [{ text:"🔄 重新开始", next:"start"}], onLoad:()=>addEnding("永远的病患") },
            endingBad4: { text: "🪞 镜中世界：你被困在了镜子里。", choices: [{ text:"🔄 重新开始", next:"start"}], onLoad:()=>addEnding("镜中世界") },
            endingBad5: { text: "💉 最后的诊断：你从来就不是活人。", choices: [{ text:"🔄 重新开始", next:"start"}], onLoad:()=>addEnding("最后的诊断") },
            endingBad6: { text: "👻 没有五官的小美：小美的照片拍摄于1949年。", choices: [{ text:"🔄 重新开始", next:"start"}], onLoad:()=>addEnding("没有五官的小美") },
            endingBad7: { text: "📷 被同化的灵魂：你成了医院的永久住户。", choices: [{ text:"🔄 重新开始", next:"start"}], onLoad:()=>addEnding("被同化的灵魂") },
            endingBad8: { text: "🔄 替代品：小杰被替换了，现在轮到你了。", choices: [{ text:"🔄 重新开始", next:"start"}], onLoad:()=>addEnding("替代品") },
            endingBad9: { text: "📞 求救无门：电话那头是你自己的声音。", choices: [{ text:"🔄 重新开始", next:"start"}], onLoad:()=>addEnding("求救无门") },
            endingDoll: { text: "💀 布娃娃的诅咒：你变成了布娃娃。", choices: [{ text:"🔄 重新开始", next:"start"}], onLoad:()=>addEnding("布娃娃的诅咒") },
            endingMixed: { text: "🌅 破碎的镜像：你逃出来了，但镜中的你还在笑。", choices: [{ text:"🔄 重新开始", next:"start"}], onLoad:()=>addEnding("破碎的镜像") },
            endingMixed2: { text: "🚗 永远的多一人：车上多了一个人，没人知道是谁。", choices: [{ text:"🔄 重新开始", next:"start"}], onLoad:()=>addEnding("永远的多一人") },
            endingTruth: { text: "🔴 真相大白：你是1949年院长的转世，灵魂终于安息。", choices: [{ text:"🔄 重新开始", next:"start"}], onLoad:()=>addEnding("真相大白") }
        };
        
        function updateGame() {
            let node = gameData[currentNode];
            if(!node) { document.getElementById('storyText').innerHTML = "错误"; return; }
            document.getElementById('storyText').innerHTML = node.text.replace(/\n/g,'<br>');
            if(node.onLoad) node.onLoad();
            let choicesArea = document.getElementById('choicesArea');
            choicesArea.innerHTML = '';
            for(let i=0;i<node.choices.length;i++) {
                let btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerHTML = node.choices[i].text;
                btn.onclick = function() { currentNode = node.choices[i].next; updateGame(); };
                choicesArea.appendChild(btn);
            }
        }
        function resetGame() { currentNode = 'start'; updateGame(); }
        
        document.getElementById('resetBtn').onclick = resetGame;
        document.getElementById('saveBtn').onclick = saveGame;
        document.getElementById('loadBtn').onclick = loadGame;
        updateEndingStats();
        updateGame();
        console.log('🏥 恐怖游戏已启动，点击页面启动音效');
    </script>
</body>
</html>
